name: Build PKHeX for Juice ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish PKHeX ARM64
        shell: pwsh
        run: |
          dotnet publish PKHeX.WinForms/PKHeX.WinForms.csproj `
            -c Release `
            -r win-arm64 `
            --self-contained true `
            -p:RuntimeIdentifier=win-arm64 `
            -p:PublishSingleFile=false `
            -p:PublishReadyToRun=false `
            -o PKHeX-Juice

      - name: Limit .NET GC reservation
        shell: pwsh
        run: |
          $path = "PKHeX-Juice\PKHeX.runtimeconfig.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json

          if (-not $json.runtimeOptions.configProperties) {
            $json.runtimeOptions | Add-Member `
              -MemberType NoteProperty `
              -Name configProperties `
              -Value ([PSCustomObject]@{})
          }

          $json.runtimeOptions.configProperties |
            Add-Member `
              -MemberType NoteProperty `
              -Name "System.GC.RegionRange" `
              -Value 1073741824 `
              -Force

          $json | ConvertTo-Json -Depth 20 | Set-Content $path

      - name: Add ARM64 Universal CRT
        shell: pwsh
        run: |
          $root = "${env:ProgramFiles(x86)}\Windows Kits\10\Redist"

          Write-Host "Searching for ARM64 Universal CRT under $root"

          $ucrtbase = Get-ChildItem $root `
            -Recurse `
            -Filter ucrtbase.dll `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.DirectoryName -match "\\arm64$"
            } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $ucrtbase) {
            throw "Could not find ARM64 ucrtbase.dll in Windows SDK."
          }

          $ucrtDir = $ucrtbase.DirectoryName

          Write-Host "Using UCRT directory:"
          Write-Host $ucrtDir

          Copy-Item "$ucrtDir\*.dll" "PKHeX-Juice\" -Force

          Write-Host "Copied UCRT DLLs:"
          Get-ChildItem "PKHeX-Juice\api-ms-win-crt-*.dll"
          Get-ChildItem "PKHeX-Juice\ucrtbase.dll"

      - name: Verify ARM64 build contents
        shell: pwsh
        run: |
          Write-Host "Runtime config:"
          Get-Content "PKHeX-Juice\PKHeX.runtimeconfig.json"

          Write-Host "UCRT DLL count:"
          (Get-ChildItem "PKHeX-Juice\api-ms-win-crt-*.dll").Count

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path PKHeX-Juice `
            -DestinationPath PKHeX-Juice-ARM64.zip `
            -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PKHeX-Juice-ARM64
          path: PKHeX-Juice-ARM64.zip
