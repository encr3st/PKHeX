name: Build PKHeX for Juice ARM64

on:
  workflow_dispatch:

jobs:
  build:
    name: Build PKHeX ARM64
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------------
      # 1. Check out PKHeX
      # ------------------------------------------------------------
      - name: Checkout PKHeX
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Install .NET 10
      # ------------------------------------------------------------
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # ------------------------------------------------------------
      # 3. Install Python for PE patching
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pefile
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pefile

      # ------------------------------------------------------------
      # 4. Publish PKHeX as self-contained Windows ARM64
      # ------------------------------------------------------------
      - name: Publish PKHeX ARM64
        shell: pwsh
        run: |
          dotnet publish PKHeX.WinForms/PKHeX.WinForms.csproj `
            -c Release `
            -r win-arm64 `
            --self-contained true `
            -p:RuntimeIdentifier=win-arm64 `
            -p:PublishSingleFile=false `
            -p:PublishReadyToRun=false `
            -o PKHeX-Juice

          if (-not (Test-Path "PKHeX-Juice\PKHeX.exe")) {
            throw "PKHeX.exe was not created."
          }

          Write-Host ""
          Write-Host "ARM64 publish completed."

      # ------------------------------------------------------------
      # 5. Reduce .NET GC virtual-address reservation
      #
      # Retains the workaround from the earlier x64/CoreCLR problem.
      # ------------------------------------------------------------
      - name: Configure .NET GC for Juice
        shell: pwsh
        run: |
          $path = "PKHeX-Juice\PKHeX.runtimeconfig.json"

          if (-not (Test-Path $path)) {
            throw "PKHeX.runtimeconfig.json was not found."
          }

          $json = Get-Content $path -Raw | ConvertFrom-Json

          if (-not $json.runtimeOptions.configProperties) {
            $json.runtimeOptions |
              Add-Member `
                -MemberType NoteProperty `
                -Name configProperties `
                -Value ([PSCustomObject]@{})
          }

          $json.runtimeOptions.configProperties |
            Add-Member `
              -MemberType NoteProperty `
              -Name "System.GC.RegionRange" `
              -Value 1073741824 `
              -Force

          $json |
            ConvertTo-Json -Depth 20 |
            Set-Content $path -Encoding UTF8

          Write-Host ""
          Write-Host "Updated runtime configuration:"
          Get-Content $path

      # ------------------------------------------------------------
      # 6. Patch UCRT API-set imports
      #
      # Juice/Grape is failing its API-set schema resolution.
      #
      # Wine's own API-set table maps all api-ms-win-crt-* contracts
      # to ucrtbase.dll, so we perform that mapping directly in the
      # PE import tables.
      #
      # This patches ALL EXEs and DLLs in the self-contained publish,
      # not just PKHeX.exe, because hostfxr/coreclr/etc. may also
      # reference UCRT API-set names.
      # ------------------------------------------------------------
      - name: Patch UCRT imports for Juice
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import pefile
          import sys

          ROOT = Path("PKHeX-Juice")

          PREFIX = b"api-ms-win-crt-"
          REPLACEMENT = b"ucrtbase.dll"

          patched_files = 0
          patched_imports = 0


          def patch_name(pe, rva, old_name, path, kind):
              global patched_imports

              if rva is None:
                  return False

              if not old_name.lower().startswith(PREFIX):
                  return False

              # Include the terminating NUL belonging to the
              # original DLL name.
              available = len(old_name) + 1

              replacement = (
                  REPLACEMENT +
                  b"\x00" * (available - len(REPLACEMENT))
              )

              if len(REPLACEMENT) + 1 > available:
                  raise RuntimeError(
                      f"Replacement will not fit in {path}: "
                      f"{old_name!r}"
                  )

              print(
                  f"{path.name}: [{kind}] "
                  f"{old_name.decode(errors='replace')} "
                  f"-> ucrtbase.dll"
              )

              pe.set_bytes_at_rva(rva, replacement)
              patched_imports += 1
              return True


          pe_files = sorted(
              list(ROOT.rglob("*.exe")) +
              list(ROOT.rglob("*.dll"))
          )

          print(f"Scanning {len(pe_files)} PE files...")
          print()

          for path in pe_files:
              try:
                  pe = pefile.PE(str(path), fast_load=False)
              except Exception:
                  continue

              changed = False

              # -------------------------------
              # Normal import directory
              # -------------------------------
              if hasattr(pe, "DIRECTORY_ENTRY_IMPORT"):
                  for entry in pe.DIRECTORY_ENTRY_IMPORT:
                      name = entry.dll

                      if not name:
                          continue

                      if name.lower().startswith(PREFIX):
                          rva = int(entry.struct.Name)

                          if patch_name(
                              pe,
                              rva,
                              name,
                              path,
                              "IMPORT"
                          ):
                              changed = True

              # -------------------------------
              # Delay-load import directory
              # -------------------------------
              if hasattr(pe, "DIRECTORY_ENTRY_DELAY_IMPORT"):
                  for entry in pe.DIRECTORY_ENTRY_DELAY_IMPORT:
                      name = entry.dll

                      if not name:
                          continue

                      if not name.lower().startswith(PREFIX):
                          continue

                      name_value = int(entry.struct.szName)

                      # Modern delay-import descriptors normally
                      # contain RVAs when bit 0 of grAttrs is set.
                      attrs = int(entry.struct.grAttrs)

                      if attrs & 1:
                          rva = name_value
                      else:
                          rva = (
                              name_value -
                              int(pe.OPTIONAL_HEADER.ImageBase)
                          )

                      if patch_name(
                          pe,
                          rva,
                          name,
                          path,
                          "DELAY"
                      ):
                          changed = True

              if changed:
                  pe.write(filename=str(path))
                  patched_files += 1

              pe.close()

          print()
          print(
              f"Patched {patched_imports} UCRT imports "
              f"across {patched_files} PE files."
          )

          if patched_imports == 0:
              raise RuntimeError(
                  "No api-ms-win-crt imports were found to patch."
              )
          '@ | Set-Content patch_ucrt.py -Encoding UTF8

          python patch_ucrt.py

      # ------------------------------------------------------------
      # 7. Verify no api-ms-win-crt imports remain
      # ------------------------------------------------------------
      - name: Verify patched imports
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import pefile
          import sys

          ROOT = Path("PKHeX-Juice")
          PREFIX = b"api-ms-win-crt-"

          leftovers = []
          ucrt_imports = []

          pe_files = sorted(
              list(ROOT.rglob("*.exe")) +
              list(ROOT.rglob("*.dll"))
          )

          for path in pe_files:
              try:
                  pe = pefile.PE(str(path), fast_load=False)
              except Exception:
                  continue

              if hasattr(pe, "DIRECTORY_ENTRY_IMPORT"):
                  for entry in pe.DIRECTORY_ENTRY_IMPORT:
                      name = entry.dll or b""
                      low = name.lower()

                      if low.startswith(PREFIX):
                          leftovers.append(
                              (path.name, name.decode(errors="replace"))
                          )

                      if low == b"ucrtbase.dll":
                          ucrt_imports.append(path.name)

              if hasattr(pe, "DIRECTORY_ENTRY_DELAY_IMPORT"):
                  for entry in pe.DIRECTORY_ENTRY_DELAY_IMPORT:
                      name = entry.dll or b""
                      low = name.lower()

                      if low.startswith(PREFIX):
                          leftovers.append(
                              (path.name, name.decode(errors="replace"))
                          )

                      if low == b"ucrtbase.dll":
                          ucrt_imports.append(path.name)

              pe.close()

          print()
          print("Files now importing ucrtbase.dll:")
          for name in sorted(set(ucrt_imports)):
              print(f"  {name}")

          print()

          if leftovers:
              print("ERROR: Remaining api-ms-win-crt imports:")

              for file, dll in leftovers:
                  print(f"  {file}: {dll}")

              sys.exit(1)

          if not ucrt_imports:
              print("ERROR: No ucrtbase.dll imports found after patch.")
              sys.exit(1)

          print("SUCCESS: No api-ms-win-crt imports remain.")
          '@ | Set-Content verify_ucrt.py -Encoding UTF8

          python verify_ucrt.py

      # ------------------------------------------------------------
      # 8. Verify PKHeX.exe is ARM64
      # ------------------------------------------------------------
      - name: Verify PKHeX architecture
        shell: pwsh
        run: |
          @'
          import pefile

          pe = pefile.PE("PKHeX-Juice/PKHeX.exe")

          machine = pe.FILE_HEADER.Machine

          print(f"PKHeX.exe machine: 0x{machine:04X}")

          # IMAGE_FILE_MACHINE_ARM64
          if machine != 0xAA64:
              raise RuntimeError(
                  f"PKHeX.exe is not ARM64: 0x{machine:04X}"
              )

          print("PKHeX.exe is ARM64.")
          '@ | Set-Content verify_arch.py -Encoding UTF8

          python verify_arch.py

      # ------------------------------------------------------------
      # 9. Verify essential .NET files
      # ------------------------------------------------------------
      - name: Verify publish contents
        shell: pwsh
        run: |
          $required = @(
            "PKHeX.exe",
            "PKHeX.dll",
            "PKHeX.runtimeconfig.json",
            "coreclr.dll",
            "clrjit.dll",
            "hostfxr.dll",
            "hostpolicy.dll",
            "System.Private.CoreLib.dll"
          )

          foreach ($file in $required) {
            $path = Join-Path "PKHeX-Juice" $file

            if (-not (Test-Path $path)) {
              throw "Missing required file: $file"
            }

            Write-Host "OK: $file"
          }

      # ------------------------------------------------------------
      # 10. Create ZIP
      # ------------------------------------------------------------
      - name: Create Juice ZIP
        shell: pwsh
        run: |
          $zip = "PKHeX-Juice-ARM64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "PKHeX-Juice" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
            throw "ZIP creation failed."
          }

          Write-Host ""
          Get-Item $zip |
            Select-Object Name, Length

      # ------------------------------------------------------------
      # 11. Verify ZIP after extraction
      # ------------------------------------------------------------
      - name: Verify final ZIP
        shell: pwsh
        run: |
          $verify = "ZIP-VERIFY"

          if (Test-Path $verify) {
            Remove-Item $verify -Recurse -Force
          }

          Expand-Archive `
            "PKHeX-Juice-ARM64.zip" `
            -DestinationPath $verify `
            -Force

          $exe = Get-ChildItem `
            $verify `
            -Recurse `
            -Filter "PKHeX.exe"

          $coreclr = Get-ChildItem `
            $verify `
            -Recurse `
            -Filter "coreclr.dll"

          Write-Host ""
          Write-Host "Final ZIP:"
          Write-Host "PKHeX.exe count: $($exe.Count)"
          Write-Host "coreclr.dll count: $($coreclr.Count)"

          if ($exe.Count -ne 1) {
            throw "PKHeX.exe missing from ZIP."
          }

          if ($coreclr.Count -ne 1) {
            throw "coreclr.dll missing from ZIP."
          }

          Write-Host "ZIP verification passed."

      # ------------------------------------------------------------
      # 12. Upload
      # ------------------------------------------------------------
      - name: Upload PKHeX Juice ARM64
        uses: actions/upload-artifact@v4
        with:
          name: PKHeX-Juice-ARM64
          path: PKHeX-Juice-ARM64.zip
          if-no-files-found: error
