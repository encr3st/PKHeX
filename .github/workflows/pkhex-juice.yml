name: Build PKHeX for Juice ARM64

on:
  workflow_dispatch:

jobs:
  build:
    name: Build PKHeX ARM64
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------------
      # 1. Check out PKHeX
      # ------------------------------------------------------------
      - name: Checkout PKHeX
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Install .NET 10
      # ------------------------------------------------------------
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # ------------------------------------------------------------
      # 3. Publish self-contained Windows ARM64 PKHeX
      # ------------------------------------------------------------
      - name: Publish PKHeX ARM64
        shell: pwsh
        run: |
          dotnet publish PKHeX.WinForms/PKHeX.WinForms.csproj `
            -c Release `
            -r win-arm64 `
            --self-contained true `
            -p:RuntimeIdentifier=win-arm64 `
            -p:PublishSingleFile=false `
            -p:PublishReadyToRun=false `
            -o PKHeX-Juice

          if (-not (Test-Path "PKHeX-Juice\PKHeX.exe")) {
            throw "PKHeX.exe was not created."
          }

          Write-Host ""
          Write-Host "PKHeX ARM64 publish completed."

      # ------------------------------------------------------------
      # 4. Reduce CoreCLR GC virtual address reservation
      # ------------------------------------------------------------
      - name: Configure .NET GC for Juice
        shell: pwsh
        run: |
          $path = "PKHeX-Juice\PKHeX.runtimeconfig.json"

          if (-not (Test-Path $path)) {
            throw "PKHeX.runtimeconfig.json was not found."
          }

          $json = Get-Content $path -Raw | ConvertFrom-Json

          if (-not $json.runtimeOptions.configProperties) {
            $json.runtimeOptions |
              Add-Member `
                -MemberType NoteProperty `
                -Name configProperties `
                -Value ([PSCustomObject]@{})
          }

          $json.runtimeOptions.configProperties |
            Add-Member `
              -MemberType NoteProperty `
              -Name "System.GC.RegionRange" `
              -Value 1073741824 `
              -Force

          $json |
            ConvertTo-Json -Depth 20 |
            Set-Content $path -Encoding UTF8

          Write-Host ""
          Write-Host "Updated runtimeconfig:"
          Get-Content $path

      # ------------------------------------------------------------
      # 5. Download an official Microsoft ARM64 Windows SDK package.
      #
      # We deliberately use SDK 10.0.22621.1 rather than relying on
      # the SDK installed on the GitHub runner.
      # ------------------------------------------------------------
      - name: Download ARM64 Windows SDK package
        shell: pwsh
        run: |
          $sdkVersion = "10.0.22621.1"

          New-Item `
            -ItemType Directory `
            -Path "WindowsSDK-NuGet" `
            -Force | Out-Null

          nuget install Microsoft.Windows.SDK.CPP.arm64 `
            -Version $sdkVersion `
            -OutputDirectory "WindowsSDK-NuGet" `
            -DirectDownload `
            -NonInteractive

          Write-Host ""
          Write-Host "Downloaded SDK packages:"

          Get-ChildItem "WindowsSDK-NuGet" -Directory |
            Select-Object FullName

      # ------------------------------------------------------------
      # 6. Locate the ARM64 UCRT redistributable inside the NuGet
      #    package by looking for the API-set DLL itself.
      #
      # We do NOT assume a particular internal package directory.
      # ------------------------------------------------------------
      - name: Find ARM64 UCRT in SDK package
        shell: pwsh
        run: |
          $armPackage = Get-ChildItem `
            "WindowsSDK-NuGet" `
            -Directory |
            Where-Object {
              $_.Name -like "Microsoft.Windows.SDK.CPP.arm64.*"
            } |
            Select-Object -First 1

          if (-not $armPackage) {
            throw "Microsoft.Windows.SDK.CPP.arm64 package directory was not found."
          }

          Write-Host "ARM64 SDK package:"
          Write-Host $armPackage.FullName
          Write-Host ""

          $runtimeForwarder = Get-ChildItem `
            $armPackage.FullName `
            -Recurse `
            -File `
            -Filter "api-ms-win-crt-runtime-l1-1-0.dll" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $runtimeForwarder) {
            Write-Host ""
            Write-Host "DLL directories found in package:"

            Get-ChildItem `
              $armPackage.FullName `
              -Recurse `
              -File `
              -Filter "*.dll" `
              -ErrorAction SilentlyContinue |
              Select-Object -First 100 FullName

            throw "ARM64 UCRT API-set forwarders were not found in the SDK NuGet package."
          }

          $ucrtDir = $runtimeForwarder.Directory.FullName

          Write-Host "Found UCRT directory:"
          Write-Host $ucrtDir
          Write-Host ""

          # Save path for later steps.
          $ucrtDir | Out-File `
            -FilePath "ucrt-directory.txt" `
            -Encoding ascii

          Write-Host "Contents:"
          Get-ChildItem $ucrtDir |
            Sort-Object Name |
            Select-Object Name, Length

      # ------------------------------------------------------------
      # 7. Copy the complete ARM64 app-local UCRT next to PKHeX.
      # ------------------------------------------------------------
      - name: Add ARM64 Universal CRT to PKHeX
        shell: pwsh
        run: |
          $ucrtDir = (
            Get-Content "ucrt-directory.txt" -Raw
          ).Trim()

          if (-not (Test-Path $ucrtDir)) {
            throw "Saved UCRT directory does not exist: $ucrtDir"
          }

          Write-Host "Copying UCRT from:"
          Write-Host $ucrtDir
          Write-Host ""

          Copy-Item `
            "$ucrtDir\*.dll" `
            "PKHeX-Juice\" `
            -Force

          Write-Host "Copy complete."

      # ------------------------------------------------------------
      # 8. Verify that the API-set DLLs now REALLY exist.
      # ------------------------------------------------------------
      - name: Verify ARM64 UCRT files
        shell: pwsh
        run: |
          $apiDlls = @(
            Get-ChildItem `
              "PKHeX-Juice\api-ms-win-*.dll" `
              -ErrorAction SilentlyContinue
          )

          $crtDlls = @(
            Get-ChildItem `
              "PKHeX-Juice\api-ms-win-crt-*.dll" `
              -ErrorAction SilentlyContinue
          )

          $ucrtBase = Test-Path "PKHeX-Juice\ucrtbase.dll"

          Write-Host ""
          Write-Host "All API-set DLL count: $($apiDlls.Count)"
          Write-Host "CRT API-set DLL count: $($crtDlls.Count)"
          Write-Host "ucrtbase.dll present: $ucrtBase"
          Write-Host ""

          if ($crtDlls.Count -eq 0) {
            throw "No api-ms-win-crt DLLs exist in PKHeX-Juice."
          }

          if (-not $ucrtBase) {
            throw "ucrtbase.dll does not exist in PKHeX-Juice."
          }

          $required = @(
            "api-ms-win-crt-runtime-l1-1-0.dll",
            "api-ms-win-crt-heap-l1-1-0.dll",
            "api-ms-win-crt-time-l1-1-0.dll",
            "api-ms-win-crt-stdio-l1-1-0.dll",
            "api-ms-win-crt-locale-l1-1-0.dll",
            "api-ms-win-crt-string-l1-1-0.dll",
            "api-ms-win-crt-convert-l1-1-0.dll",
            "api-ms-win-crt-math-l1-1-0.dll"
          )

          foreach ($dll in $required) {
            $path = Join-Path "PKHeX-Juice" $dll

            if (-not (Test-Path $path)) {
              throw "Required UCRT forwarder is missing: $dll"
            }

            Write-Host "OK: $dll"
          }

          Write-Host ""
          Write-Host "All UCRT DLL checks passed."

      # ------------------------------------------------------------
      # 9. Verify the copied DLLs are ARM64 PE files.
      # ------------------------------------------------------------
      - name: Verify UCRT architecture
        shell: pwsh
        run: |
          function Get-PEMachine {
            param([string]$Path)

            $stream = [System.IO.File]::OpenRead($Path)

            try {
              $reader = New-Object System.IO.BinaryReader($stream)

              $stream.Position = 0x3C
              $peOffset = $reader.ReadInt32()

              $stream.Position = $peOffset + 4
              return $reader.ReadUInt16()
            }
            finally {
              $stream.Dispose()
            }
          }

          $files = @(
            "PKHeX-Juice\ucrtbase.dll",
            "PKHeX-Juice\api-ms-win-crt-runtime-l1-1-0.dll",
            "PKHeX-Juice\api-ms-win-crt-heap-l1-1-0.dll"
          )

          foreach ($file in $files) {
            $machine = Get-PEMachine $file

            Write-Host "$file machine = 0x$($machine.ToString('X4'))"

            # IMAGE_FILE_MACHINE_ARM64 = 0xAA64
            if ($machine -ne 0xAA64) {
              throw "$file is not ARM64."
            }
          }

          Write-Host ""
          Write-Host "UCRT architecture verification passed."

      # ------------------------------------------------------------
      # 10. Verify the important .NET/PKHeX files.
      # ------------------------------------------------------------
      - name: Verify PKHeX package
        shell: pwsh
        run: |
          $required = @(
            "PKHeX.exe",
            "PKHeX.dll",
            "PKHeX.runtimeconfig.json",
            "coreclr.dll",
            "clrjit.dll",
            "System.Private.CoreLib.dll",
            "ucrtbase.dll",
            "api-ms-win-crt-runtime-l1-1-0.dll"
          )

          foreach ($file in $required) {
            $path = Join-Path "PKHeX-Juice" $file

            if (-not (Test-Path $path)) {
              throw "Missing required file: $file"
            }

            Write-Host "OK: $file"
          }

      # ------------------------------------------------------------
      # 11. Create final ZIP.
      # ------------------------------------------------------------
      - name: Create Juice ZIP
        shell: pwsh
        run: |
          $zip = "PKHeX-Juice-ARM64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "PKHeX-Juice" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
            throw "ZIP creation failed."
          }

          Get-Item $zip |
            Select-Object Name, Length

      # ------------------------------------------------------------
      # 12. Extract ZIP again and verify its actual contents.
      # ------------------------------------------------------------
      - name: Verify final ZIP
        shell: pwsh
        run: |
          $verify = "ZIP-VERIFY"

          if (Test-Path $verify) {
            Remove-Item $verify -Recurse -Force
          }

          Expand-Archive `
            "PKHeX-Juice-ARM64.zip" `
            -DestinationPath $verify `
            -Force

          $crtDlls = @(
            Get-ChildItem `
              $verify `
              -Recurse `
              -Filter "api-ms-win-crt-*.dll"
          )

          $pkhex = @(
            Get-ChildItem `
              $verify `
              -Recurse `
              -Filter "PKHeX.exe"
          )

          $ucrt = @(
            Get-ChildItem `
              $verify `
              -Recurse `
              -Filter "ucrtbase.dll"
          )

          Write-Host ""
          Write-Host "FINAL ZIP:"
          Write-Host "PKHeX.exe: $($pkhex.Count)"
          Write-Host "ucrtbase.dll: $($ucrt.Count)"
          Write-Host "api-ms-win-crt DLLs: $($crtDlls.Count)"
          Write-Host ""

          if ($pkhex.Count -ne 1) {
            throw "PKHeX.exe missing from ZIP."
          }

          if ($ucrt.Count -eq 0) {
            throw "ucrtbase.dll missing from ZIP."
          }

          if ($crtDlls.Count -eq 0) {
            throw "api-ms-win-crt DLLs missing from ZIP."
          }

          $crtDlls |
            Sort-Object Name |
            Select-Object Name

      # ------------------------------------------------------------
      # 13. Upload final Juice package.
      # ------------------------------------------------------------
      - name: Upload PKHeX Juice ARM64
        uses: actions/upload-artifact@v4
        with:
          name: PKHeX-Juice-ARM64
          path: PKHeX-Juice-ARM64.zip
          if-no-files-found: error
