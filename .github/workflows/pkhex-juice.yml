      - name: Build ARM64 Juice launcher
        shell: pwsh
        run: |
          @'
          #define WIN32_LEAN_AND_MEAN
          #include <windows.h>

          /*
           * Static storage instead of a ~64 KiB stack allocation.
           * This avoids MSVC generating a __chkstk dependency.
           */
          static WCHAR g_path[32768];

          static const WCHAR g_target[] = L"PKHeX.exe";

          __declspec(noreturn)
          void WINAPI LauncherEntry(void)
          {
              DWORD length;
              DWORD pos;
              DWORD j;

              STARTUPINFOW startup;
              PROCESS_INFORMATION process;
              DWORD exitCode = 255;

              /*
               * Get the full path of START-PKHeX.exe.
               */
              length = GetModuleFileNameW(
                  NULL,
                  g_path,
                  32768
              );

              if (length == 0 || length >= 32768)
                  ExitProcess(101);

              /*
               * Locate the final directory separator.
               */
              pos = length;

              while (pos > 0)
              {
                  WCHAR c = g_path[pos - 1];

                  if (c == L'\\' || c == L'/')
                      break;

                  --pos;
              }

              if (pos == 0)
                  ExitProcess(102);

              /*
               * Replace START-PKHeX.exe with PKHeX.exe.
               */
              j = 0;

              while (g_target[j] != L'\0')
              {
                  if ((pos + j + 1) >= 32768)
                      ExitProcess(103);

                  g_path[pos + j] = g_target[j];
                  ++j;
              }

              g_path[pos + j] = L'\0';

              /*
               * Tell CoreCLR not to use its normal PE mapping path.
               */
              if (!SetEnvironmentVariableW(
                      L"DOTNET_PELoader_DisableMapping",
                      L"1"))
              {
                  ExitProcess(110);
              }

              /*
               * Disable ReadyToRun so framework code goes through
               * the JIT rather than using precompiled R2R code.
               */
              if (!SetEnvironmentVariableW(
                      L"DOTNET_ReadyToRun",
                      L"0"))
              {
                  ExitProcess(111);
              }

              /*
               * 0x40000000 = 1 GiB.
               */
              if (!SetEnvironmentVariableW(
                      L"DOTNET_GCRegionRange",
                      L"40000000"))
              {
                  ExitProcess(112);
              }

              /*
               * Initialize STARTUPINFO without the C runtime.
               */
              GetStartupInfoW(&startup);

              /*
               * Start PKHeX.exe.
               *
               * The environment variables above are inherited.
               */
              if (!CreateProcessW(
                      g_path,
                      NULL,
                      NULL,
                      NULL,
                      FALSE,
                      0,
                      NULL,
                      NULL,
                      &startup,
                      &process))
              {
                  ExitProcess(120);
              }

              /*
               * Wait for PKHeX to exit.
               */
              WaitForSingleObject(
                  process.hProcess,
                  INFINITE
              );

              GetExitCodeProcess(
                  process.hProcess,
                  &exitCode
              );

              CloseHandle(process.hThread);
              CloseHandle(process.hProcess);

              ExitProcess(exitCode);
          }
          '@ | Set-Content juice_launcher.c -Encoding ASCII

          Write-Host "Compiling ARM64 launcher..."

          cl.exe `
            /nologo `
            /c `
            /O2 `
            /GS- `
            /Zl `
            /DUNICODE `
            /D_UNICODE `
            juice_launcher.c `
            /Fo:juice_launcher.obj

          if ($LASTEXITCODE -ne 0) {
            throw "ARM64 launcher compilation failed."
          }

          Write-Host ""
          Write-Host "Linking ARM64 launcher..."

          link.exe `
            /nologo `
            /machine:arm64 `
            /subsystem:windows `
            /nodefaultlib `
            /entry:LauncherEntry `
            juice_launcher.obj `
            kernel32.lib `
            /out:PKHeX-Juice\START-PKHeX.exe

          if ($LASTEXITCODE -ne 0) {
            throw "ARM64 launcher link failed."
          }

          if (-not (Test-Path "PKHeX-Juice\START-PKHeX.exe")) {
            throw "START-PKHeX.exe was not created."
          }

          Write-Host ""
          Write-Host "Launcher created successfully:"
          Get-Item "PKHeX-Juice\START-PKHeX.exe" |
            Select-Object Name, Length
